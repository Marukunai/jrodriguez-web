<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Novedades — J Rodriguez</title>
  <link rel="icon" href="public/img/favicon.ico" sizes="any" />
  <link rel="icon" href="public/img/favicon-32.png" type="image/png" />
  <link rel="apple-touch-icon" href="public/img/apple-touch-icon.png" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Novedades — J Rodriguez" />
  <meta property="og:description" content="Últimos vídeos y próximos estrenos de J Rodriguez." />
  <meta property="og:image" content="https://marukunai.github.io/jrodriguez-web/public/img/og-image.jpg" />
  <meta property="og:url" content="https://marukunai.github.io/jrodriguez-web/novedades.html" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="stylesheet" href="public/styles.css" />
</head>
<body>
  <a href="#main" class="skip-link">Saltar al contenido</a>
  <header>
    <div class="header-row">
      <div class="brand">J RODRIGUEZ</div>
      <button class="nav-toggle" id="navToggle" aria-label="Abrir menú" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
    <nav id="mainNav">
      <a href="index.html">Inicio</a>
      <a href="novedades.html" class="active">Novedades</a>
      <a href="newsletter.html">Newsletter</a>
      <a href="contacto.html">Contacto</a>
    </nav>
  </header>

  <main id="main">
    <section class="section" style="padding-top: 3rem;">
      <div id="upcomingSection"></div>

      <span class="eyebrow">En emisión</span>
      <h2 style="margin-top:0.6rem;">Vídeos y lanzamientos</h2>
      <div id="releaseGrid" class="release-grid"></div>
    </section>
  </main>

  <footer>
    <p>Sitio de J Rodriguez · <a href="privacidad.html">Aviso legal y privacidad</a> · actualizado a mano en <a href="https://github.com/" target="_blank" rel="noopener">GitHub</a></p>
  </footer>

  <script src="public/nav.js"></script>
  <script src="public/youtube.js"></script>
  <script src="public/collabs.js"></script>
  <script>
    /* Se usa solo si la YouTube API falla o la key aún no está puesta,
       para que la página nunca se quede vacía. */
    const FALLBACK_RELEASES = [
      {
        id: "n5-WrjoIK_U",
        title: "J Rodriguez - TOP TEAM (Visualizer)",
        publishedAt: "2026-07-18T00:00:00Z",
        url: "https://www.youtube.com/watch?v=n5-WrjoIK_U"
      }
    ];

    function formatDate(iso) {
      return new Date(iso).toLocaleDateString("es-ES", { day: "2-digit", month: "short", year: "numeric" });
    }

    function renderCard(item) {
      const shareText = encodeURIComponent(`${item.title} — J Rodriguez`);
      const shareUrl = encodeURIComponent(item.url);
      const waLink = `https://wa.me/?text=${shareText}%20${shareUrl}`;
      const xLink = `https://twitter.com/intent/tweet?text=${shareText}&url=${shareUrl}`;

      return `
        <div class="release-card">
          <div class="release-thumb">
            <iframe
              src="https://www.youtube.com/embed/${item.id}"
              title="${item.title}"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
              allowfullscreen
              loading="lazy">
            </iframe>
          </div>
          <div class="release-body">
            <div class="release-meta">YouTube · ${formatDate(item.publishedAt)}${item.withArtist ? ` · con ${item.withArtist}` : ""}</div>
            <h3>${item.title}</h3>
            <div class="release-actions">
              <a class="yt" href="${item.url}" target="_blank" rel="noopener">Ver en YouTube</a>
              <a class="share-btn" href="${waLink}" target="_blank" rel="noopener" aria-label="Compartir en WhatsApp">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.39 1.26 4.81L2 22l5.42-1.35a9.9 9.9 0 0 0 4.62 1.15h.01c5.46 0 9.9-4.45 9.9-9.9C21.95 6.45 17.5 2 12.04 2Zm5.8 14.13c-.24.68-1.4 1.3-1.93 1.36-.5.06-1.03.09-3.06-.7-2.58-1.02-4.25-3.63-4.38-3.8-.13-.17-1.05-1.4-1.05-2.67 0-1.27.66-1.9.9-2.16.24-.26.52-.32.7-.32h.5c.16 0 .38-.03.58.44.24.56.8 1.94.87 2.08.07.14.11.3.02.48-.09.18-.14.29-.28.44-.14.16-.29.35-.42.47-.14.13-.29.28-.12.55.16.28.72 1.18 1.55 1.91 1.06.94 1.96 1.24 2.24 1.38.28.14.44.12.6-.07.16-.19.68-.79.86-1.06.18-.28.36-.23.6-.14.24.09 1.53.72 1.79.85.26.13.44.19.5.3.07.11.07.63-.17 1.31Z"/></svg>
                WhatsApp
              </a>
              <a class="share-btn" href="${xLink}" target="_blank" rel="noopener" aria-label="Compartir en X">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.9 2H22l-7.4 8.5L23.3 22H16.7l-5.2-6.8L5.6 22H2.5l7.9-9L1.9 2h6.8l4.7 6.2L18.9 2Zm-1.2 18h1.7L7.4 4H5.6l12.1 16Z"/></svg>
                X
              </a>
            </div>
          </div>
        </div>`;
    }

    async function render() {
      const grid = document.getElementById("releaseGrid");
      let videos;
      try {
        videos = await ytGetLatestVideos(12);
        if (!videos.length) throw new Error("El canal no devolvió vídeos.");
      } catch (err) {
        console.warn("No se pudo conectar con la YouTube API, mostrando vídeos de respaldo:", err.message);
        videos = FALLBACK_RELEASES;
      }

      // Mezcla con las colaboraciones de public/collabs.js (sin duplicar
      // si algún id ya coincidiera) y ordena todo por fecha.
      const seen = new Set(videos.map(v => v.id));
      const extras = MANUAL_COLLABS.filter(v => !seen.has(v.id));
      const all = [...videos, ...extras].sort(
        (a, b) => new Date(b.publishedAt) - new Date(a.publishedAt)
      );

      grid.innerHTML = all.map(renderCard).join("");
    }

    function formatCountdown(iso) {
      const diffMs = new Date(iso).getTime() - Date.now();
      if (diffMs <= 0) return "Estrenando…";
      const days = Math.floor(diffMs / 86400000);
      const hours = Math.floor((diffMs % 86400000) / 3600000);
      if (days > 0) return `Estreno en ${days}d ${hours}h`;
      const minutes = Math.floor((diffMs % 3600000) / 60000);
      return `Estreno en ${hours}h ${minutes}min`;
    }

    function formatFullDate(iso) {
      return new Date(iso).toLocaleString("es-ES", {
        day: "2-digit", month: "long", year: "numeric", hour: "2-digit", minute: "2-digit"
      });
    }

    async function renderUpcoming() {
      const box = document.getElementById("upcomingSection");
      try {
        const [next] = await ytGetUpcomingPremieres();
        if (!next) return; // no hay nada programado: la sección no aparece

        box.innerHTML = `
          <div class="upcoming-banner">
            <img src="${next.thumbnail}" alt="${next.title}" />
            <div class="upcoming-text">
              <span class="eyebrow">Próximo estreno</span>
              <h3>${next.title}</h3>
              <div class="upcoming-countdown">${formatCountdown(next.scheduledStartTime)} · ${formatFullDate(next.scheduledStartTime)}</div>
            </div>
          </div>`;
      } catch (err) {
        console.warn("No se pudo comprobar si hay preavances:", err.message);
        // si falla, simplemente no se muestra nada — no rompe el resto de la página
      }
    }

    render();
    renderUpcoming();
  </script>
  <script data-goatcounter="https://jrodriguezweb.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</body>
</html>
