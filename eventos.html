  <script>
    /* =========================================================
       PRÓXIMAS ACTUACIONES — lista a mano, sin API ni backend.
       Añade un objeto por cada fecha confirmada, con este formato:

       {
         date: "2026-09-20",       // AAAA-MM-DD, para que se ordene bien
         venue: "Sala Apolo",
         city: "Barcelona",
         info: "Puertas 21:30 · Entrada anticipada 12€",  // opcional
         ticketsUrl: "https://..."  // opcional, si hay venta de entradas
       }

       Bórralas cuando pase la fecha, o déjalas si quieres mantener un
       histórico (en ese caso habría que separar "próximas" de
       "pasadas", pero de momento no hace falta).
       ========================================================= */
    const EVENTS = [
      // Ejemplo (bórralo cuando añadas el primero real):
      // {
      //   date: "2026-09-20",
      //   venue: "Sala Apolo",
      //   city: "Barcelona",
      //   info: "Puertas 21:30",
      //   ticketsUrl: "https://example.com/entradas"
      // },
    ];

    function formatEventDate(iso) {
      const d = new Date(iso + "T00:00:00");
      return d.toLocaleDateString("es-ES", { day: "2-digit", month: "short", year: "numeric" }).toUpperCase();
    }

    function renderEvents() {
      const container = document.getElementById("eventList");

      if (!EVENTS.length) {
        container.innerHTML = `
          <div class="event-empty">
            <p>Todavía no hay actuaciones anunciadas.</p>
            <a class="btn btn-youtube" href="newsletter.html">Apúntate para enterarte el primero</a>
          </div>`;
        return;
      }

      const sorted = [...EVENTS].sort((a, b) => new Date(a.date) - new Date(b.date));
      container.innerHTML = sorted.map(ev => `
        <div class="event-row">
          <div class="event-date">${formatEventDate(ev.date)}</div>
          <div class="event-info">
            <h3>${ev.venue} — ${ev.city}</h3>
            ${ev.info ? `<p>${ev.info}</p>` : ""}
          </div>
          ${ev.ticketsUrl
          ? `<a class="btn btn-youtube" href="${ev.ticketsUrl}" target="_blank" rel="noopener">Entradas</a>`
          : `<a class="btn btn-ghost" href="contacto.html">Más info</a>`}
        </div>
      `).join("");
    }

    renderEvents();
  </script>
  <script data-goatcounter="https://jrodriguezweb.goatcounter.com/count" async
